<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gran Teatro - Vive la Magia</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          theatreGold:    '#D4AF37',
          theatreBurgundy:'#6B111D',
          theatreDark:    '#0A0A0A',
          theatreGray:    '#A9A9B3',
          theatreBeige:   '#F5F1E8',
        },
        fontFamily: {
          serif: ['Playfair Display', 'serif'],
          sans:  ['Hanken Grotesk', 'sans-serif'],
        }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
  body {
    background-color: #0A0A0A;
    color: #F5F1E8;
  }

  /* ── HERO ── */
  .hero-section {
    position: relative;
    height: 100vh;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    background-image: url('https://popularenlinea.com/Personas/Paginas/premium/content-sections/personalidades-arte/Maria-Castillo/Insumos/imagen296499470.jpg');
    background-size: cover;
    background-position: center right;
    background-repeat: no-repeat;
    z-index: 0;
    transform: scale(1.04);
    transition: transform 8s ease-out;
  }
  .hero-section:hover .hero-bg { transform: scale(1.0); }

  .hero-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(to right,  rgba(10,10,10,1) 0%, rgba(10,10,10,0.85) 40%, rgba(10,10,10,0.2) 70%, rgba(10,10,10,0) 100%),
      linear-gradient(to top,    rgba(10,10,10,0.7) 0%, rgba(10,10,10,0) 40%),
      linear-gradient(to bottom, rgba(10,10,10,0.5) 0%, rgba(10,10,10,0) 20%);
  }

  /* ── GOLD TEXT ── */
  .gold-text-gradient {
    background: linear-gradient(to right, #F4D03F, #D4AF37, #9A7B1D);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ── CARDS ── */
  .card-border-frame {
    border: 1px solid rgba(212, 175, 55, 0.25);
    position: relative;
  }
  .card-border-frame::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(212,175,55,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── FADE IN ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up  { animation: fadeUp 0.8s ease both; }
  .delay-1  { animation-delay: 0.15s; }
  .delay-2  { animation-delay: 0.3s; }
  .delay-3  { animation-delay: 0.45s; }
  .delay-4  { animation-delay: 0.6s; }

  /* ── SPIN (loader) ── */
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── NAV LINK UNDERLINE ── */
  .nav-link { position: relative; }
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -3px; left: 0;
    width: 0; height: 1px;
    background: #D4AF37;
    transition: width 0.3s ease;
  }
  .nav-link:hover::after { width: 100%; }

  /* ── GIFT CARD SHINE ── */
  .gift-card-shine { position: relative; overflow: hidden; }
  .gift-card-shine::after {
    content: '';
    position: absolute;
    top: -50%; left: -75%;
    width: 50%; height: 200%;
    background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0) 100%);
    transform: skewX(-20deg);
    transition: left 0.7s ease;
  }
  .gift-card-shine:hover::after { left: 125%; }
</style>
</head>
<body class="font-sans selection:bg-theatreGold selection:text-theatreDark">

  <!-- El SPA monta aquí: home, login, register, dashboard -->
  <div id="app"></div>

</body>
<script type="module" src="./js/app.js"></script>
</html>
