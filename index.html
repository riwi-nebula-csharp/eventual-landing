<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="theme-color" content="#0A0A0A"/>
<meta name="description" content="Teatro Eventual — Vive la magia del teatro"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="apple-touch-icon" href="./icons/icon-192.png"/>
<title>Teatro Eventual — Vive la Magia</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          theatreGold:    '#D4AF37',
          theatreBurgundy:'#6B111D',
          theatreDark:    '#0A0A0A',
          theatreGray:    '#A9A9B3',
          theatreBeige:   '#F5F1E8',
        },
        fontFamily: {
          serif: ['Playfair Display', 'serif'],
          sans:  ['Hanken Grotesk', 'sans-serif'],
        }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
  body {
    background-color: #0A0A0A;
    color: #F5F1E8;
  }

  /* ── HERO ── */
  .hero-section {
    position: relative;
    height: 100vh;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    background-image: url('https://popularenlinea.com/Personas/Paginas/premium/content-sections/personalidades-arte/Maria-Castillo/Insumos/imagen296499470.jpg');
    background-size: cover;
    background-position: center right;
    background-repeat: no-repeat;
    z-index: 0;
    transform: scale(1.04);
    transition: transform 8s ease-out;
  }
  .hero-section:hover .hero-bg { transform: scale(1.0); }

  .hero-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(to right,  rgba(10,10,10,1) 0%, rgba(10,10,10,0.85) 40%, rgba(10,10,10,0.2) 70%, rgba(10,10,10,0) 100%),
      linear-gradient(to top,    rgba(10,10,10,0.7) 0%, rgba(10,10,10,0) 40%),
      linear-gradient(to bottom, rgba(10,10,10,0.5) 0%, rgba(10,10,10,0) 20%);
  }

  /* ── GOLD TEXT ── */
  .gold-text-gradient {
    background: linear-gradient(to right, #F4D03F, #D4AF37, #9A7B1D);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ── CARDS ── */
  .card-border-frame {
    border: 1px solid rgba(212, 175, 55, 0.25);
    position: relative;
  }
  .card-border-frame::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(212,175,55,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── FADE IN ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up  { animation: fadeUp 0.8s ease both; }
  .delay-1  { animation-delay: 0.15s; }
  .delay-2  { animation-delay: 0.3s; }
  .delay-3  { animation-delay: 0.45s; }
  .delay-4  { animation-delay: 0.6s; }

  /* ── SPIN (loader) ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .animate-spin { animation: spin 1s linear infinite; }

  /* ── NAV LINK UNDERLINE ── */
  .nav-link { position: relative; }
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -3px; left: 0;
    width: 0; height: 1px;
    background: #D4AF37;
    transition: width 0.3s ease;
  }
  .nav-link:hover::after { width: 100%; }

  /* ── SEAT MAP ── */
  .seat-btn {
    width: 28px; height: 28px;
    border-radius: 4px 4px 0 0;
    border: 1px solid;
    cursor: pointer;
    font-size: 9px;
    font-weight: 600;
    transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .seat-available {
    background: rgba(212,175,55,0.12);
    border-color: rgba(212,175,55,0.4);
    color: #D4AF37;
  }
  .seat-available:hover {
    background: rgba(212,175,55,0.3);
    border-color: #D4AF37;
    transform: translateY(-2px);
  }
  .seat-selected {
    background: #D4AF37;
    border-color: #D4AF37;
    color: #0A0A0A;
    transform: translateY(-2px);
  }
  .seat-occupied {
    background: rgba(107,17,29,0.3);
    border-color: rgba(107,17,29,0.5);
    color: #6B111D;
    cursor: not-allowed;
    opacity: 0.5;
  }

  /* ── GLASS CARD (login/register) ── */
  .glass-card {
    background: rgba(10,10,10,0.75);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(212,175,55,0.2);
  }
  .theatrical-glow {
    box-shadow: 0 0 60px rgba(107,17,29,0.25), 0 0 120px rgba(107,17,29,0.1);
  }

  /* ── TOAST ── */
  #toast-container {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .toast {
    padding: 0.75rem 1.25rem;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    border-left: 3px solid;
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(10px);
    animation: fadeUp 0.3s ease both;
    max-width: 320px;
  }
  .toast-success { border-color: #22c55e; color: #86efac; }
  .toast-error   { border-color: #ef4444; color: #fca5a5; }
  .toast-info    { border-color: #D4AF37; color: #D4AF37; }

  /* ── STRIPE ELEMENTS ── */
  .StripeElement {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(212,175,55,0.25);
    padding: 12px 16px;
    border-radius: 2px;
    transition: border-color 0.2s;
  }
  .StripeElement--focus { border-color: rgba(212,175,55,0.7); }
  .StripeElement--invalid { border-color: rgba(239,68,68,0.6); }

  /* ── INPUT STYLE ── */
  input, textarea, select {
    background: rgba(255,255,255,0.05) !important;
    border-color: rgba(212,175,55,0.2) !important;
    color: #F5F1E8 !important;
    outline: none;
  }
  input:focus, textarea:focus, select:focus {
    border-color: rgba(212,175,55,0.6) !important;
    box-shadow: 0 0 0 1px rgba(212,175,55,0.2) !important;
  }
  input::placeholder, textarea::placeholder { color: rgba(169,169,179,0.4) !important; }
  select option { background: #0A0A0A; color: #F5F1E8; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #0A0A0A; }
  ::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 2px; }
</style>
</head>
<body class="font-sans selection:bg-theatreGold selection:text-theatreDark">

  <div id="app"></div>

  <!-- Toast container -->
  <div id="toast-container"></div>

</body>
<script>
  // Toast global
  window.showToast = function(msg, type = 'info', duration = 3500) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => el.remove(), duration);
  };
</script>
<script type="module" src="./js/app.js"></script>
</html>
