name: Deploy Frontend
on:
  push:
    branches:
      - main
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy VPS
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_SHA,GITHUB_REPOSITORY,REPO_NAME
          script: |
            docker login ghcr.io -u "tzerk-last" -p $TOKEN
            docker pull ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA
            docker stop $REPO_NAME || true
            docker rm $REPO_NAME || true
            docker run -d --name $REPO_NAME \
              -p 8064:80 \
              ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
