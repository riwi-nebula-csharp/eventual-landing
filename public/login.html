<!-- Interactive Layer: Particle/Atmospheric Dust effect (Canvas) -->
<canvas class="fixed inset-0 pointer-events-none z-[1] opacity-30" id="atmosphereCanvas" width="1280" height="1024"></canvas>
<script>
        // Simple Atmospheric Dust Effect
        const canvas = document.getElementById('atmosphereCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.5;
                this.alpha = Math.random() * 0.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(212, 175, 55, ${this.alpha})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 50; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Button Click Effect
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', (e) => {
            if(document.getElementById('email').value && document.getElementById('password').value) {
                loginBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Validando...';
                setTimeout(() => {
                    loginBtn.innerHTML = 'Bienvenido';
                    loginBtn.classList.add('bg-tertiary', 'text-surface');
                }, 1500);
            }
        });
    </script>
