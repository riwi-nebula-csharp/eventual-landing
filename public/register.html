<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">

<div class="text-headline-md font-headline-md font-bold tracking-tight text-tertiary">
            Teatro Eventual
        </div>
<nav class="hidden md:flex items-center gap-8">
<a class="text-on-surface-variant hover:text-on-surface transition-colors font-body-md" href="#">Programación</a>
<a class="text-on-surface-variant hover:text-on-surface transition-colors font-body-md" href="#">Boletería</a>
<a class="text-on-surface-variant hover:text-on-surface transition-colors font-body-md" href="#">Contacto</a>
</nav>
<button class="bg-primary/10 text-primary border border-primary/20 px-6 py-2 rounded-lg font-bold hover:bg-primary/20 transition-all active:scale-95">
            Mi Cuenta

</header>
<!-- Main Registration Content -->
<main class="relative z-20 flex-grow flex items-center justify-center px-4 pt-28 pb-32">
<div class="glass-card theatrical-glow w-full max-w-lg p-10 rounded-xl">
<div class="text-center mb-8">
<h1 class="font-headline-md text-display-lg text-tertiary leading-tight mb-2">Crear Cuenta</h1>
<p class="font-body-md text-on-surface-variant">Únase a nuestra comunidad y acceda a experiencias exclusivas.</p>
</div>
<form class="space-y-5" onsubmit="return false;">
<!-- Full Name -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-1" for="name">Nombre completo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">person</span>
<input class="w-full bg-surface-container-low border border-outline-variant text-on-surface rounded-lg py-3 pl-12 pr-4 font-body-md input-focus-effect transition-all placeholder:text-on-surface-variant/30" id="name" placeholder="Ej. Juan Pérez" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-1" for="email">Correo electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input class="w-full bg-surface-container-low border border-outline-variant text-on-surface rounded-lg py-3 pl-12 pr-4 font-body-md input-focus-effect transition-all placeholder:text-on-surface-variant/30" id="email" placeholder="email@ejemplo.com" type="email"/>
</div>
</div>
<!-- Phone -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-1" for="phone">Teléfono</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">call</span>
<input class="w-full bg-surface-container-low border border-outline-variant text-on-surface rounded-lg py-3 pl-12 pr-4 font-body-md input-focus-effect transition-all placeholder:text-on-surface-variant/30" id="phone" placeholder="+54 11 1234-5678" type="tel"/>
</div>
</div>
<!-- Passwords -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-1" for="password">Contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant text-on-surface rounded-lg py-3 pl-12 pr-4 font-body-md input-focus-effect transition-all placeholder:text-on-surface-variant/30" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-1" for="confirm_password">Confirmar contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">verified_user</span>
<input class="w-full bg-surface-container-low border border-outline-variant text-on-surface rounded-lg py-3 pl-12 pr-4 font-body-md input-focus-effect transition-all placeholder:text-on-surface-variant/30" id="confirm_password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>


<!-- Submit Button -->

</button>
<div class="grid gap-base">
<button class="flex items-center justify-center gap-2 border border-outline-variant hover:bg-surface-container-high py-4 rounded-lg transition-colors group">

<span class="text-label-sm font-label-sm">Google</span>
</button>

</div>
<div class="text-center mt-6">
<a class="font-body-md text-tertiary hover:text-tertiary-fixed-dim transition-colors underline underline-offset-4 decoration-tertiary/30" href="#">
                        ¿Ya tienes cuenta? Inicia sesión
                    </a>
</div>
</form>

</div>

<!-- Footer Navigation Clusters (Mandated) -->
<footer class="relative z-20 w-full mt-auto bg-surface-container-lowest/80 backdrop-blur-xl border-t border-outline-variant/30 py-8 px-gutter">

<div class="flex flex-col gap-2">
<span class="font-headline-md text-headline-md font-bold text-tertiary">Teatro Eventual</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">© 2026 Teatro Eventual - Sistema de Gestión Escénica</p>
</div>

</div>
</div>
</footer>
<!-- Atmosphere & Interactivity Script -->
<script>
        // Subtle tilt effect for the card
        const card = document.querySelector('.glass-card');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Form submission micro-interaction
        const form = document.querySelector('form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Procesando...';
            btn.classList.add('opacity-80');
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Cuenta Creada';
                btn.classList.remove('bg-[#800020]');
                btn.classList.add('bg-green-700');
            }, 1500);
        });
    </script>
</body></html>
